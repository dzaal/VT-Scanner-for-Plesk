# Publish a ready-made, installable zip as a GitHub Release for every new version.
# Runs when META_INF/meta.xml or CHANGELOG.md changes on main; skips versions that already have a release.
# Release notes come from CHANGELOG.md (see .github/release-notes.sh).
# Each release has three copies of the same package:
#   stingyscan-<version>.zip   (that version)
#   stingyscan.zip             (fixed name, so .../releases/latest/download/stingyscan.zip
#                               always points to the newest version)
#   virustotal-extension.zip   (the same StingyScan built with the old extension id, see build.sh legacy:
#                               installations of VT Site Scanner 1.x update to it in place)
name: Release

on:
  push:
    branches: [main]
    paths: [META_INF/meta.xml, CHANGELOG.md]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: v
        run: echo "version=$(sed -n 's:.*<version>\(.*\)</version>.*:\1:p' META_INF/meta.xml)" >> "$GITHUB_OUTPUT"

      - name: Skip if this version is already released
        id: exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.v.outputs.version }}" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the package
        if: steps.exists.outputs.skip != 'true'
        run: |
          bash build.sh
          bash build.sh legacy
          cp "dist/stingyscan-${{ steps.v.outputs.version }}.zip" dist/stingyscan.zip
          cp "dist/virustotal-extension-${{ steps.v.outputs.version }}.zip" dist/virustotal-extension.zip

      - name: Publish the release
        if: steps.exists.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash .github/release-notes.sh "${{ steps.v.outputs.version }}" > notes.md
          gh release create "v${{ steps.v.outputs.version }}" \
            "dist/stingyscan-${{ steps.v.outputs.version }}.zip" \
            dist/stingyscan.zip \
            dist/virustotal-extension.zip \
            --title "StingyScan ${{ steps.v.outputs.version }}" \
            --notes-file notes.md \
            --latest

      # Keep the notes of every release in step with CHANGELOG.md
      # (its own changes plus the history before it).
      - name: Refresh notes of all releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for tag in $(gh release list --limit 200 --json tagName --jq '.[].tagName'); do
            bash .github/release-notes.sh "${tag#v}" > notes.md
            gh release edit "$tag" --notes-file notes.md
          done
